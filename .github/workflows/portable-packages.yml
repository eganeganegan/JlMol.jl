name: Portable desktop packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Packages to build
        type: choice
        options:
          - all
          - macos
        default: all
  pull_request:
    paths:
      - .github/workflows/portable-packages.yml
      - CMakeLists.txt
      - LICENSE
      - Project.toml
      - cmake/**
      - examples/**
      - native/**
      - packaging/**
      - resources/**
      - src/**
      - test/**

permissions:
  contents: read

jobs:
  linux:
    if: inputs.target != 'macos'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging and graphics test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf xauth xvfb libgl-dev libgl1-mesa-dri \
            libglib2.0-0t64 libglx-mesa0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-dev libxkbcommon-x11-0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
          arch: x64
      - name: Build and test
        run: |
          cmake -S . -B build/portable -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_INSTALL_LIBDIR=lib -DJLMOL_PACKAGE_DESKTOP=ON
          cmake --build build/portable --parallel 4
          ctest --test-dir build/portable --output-on-failure
          JLMOL_CORE_LIBRARY="$PWD/build/portable/libjlmol_core.so" \
            JULIA_DEPOT_PATH="$PWD/build/portable/julia-depot" julia --startup-file=no --project=. test/runtests.jl
      - name: Create and verify the archive
        run: |
          cpack --config build/portable/CPackConfig.cmake -B build/packages
          archive=(build/packages/*.tar.gz)
          test "${#archive[@]}" -eq 1
          unpacked="$RUNNER_TEMP/Relocated JlMol package"
          mkdir -p "$unpacked"
          tar -xzf "${archive[0]}" -C "$unpacked"
          executable=$(find "$unpacked" -type f -path '*/bin/jlmol')
          test -x "$executable"
          xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' \
            python3 packaging/verify_portable.py "$(dirname "$(dirname "$executable")")"
      - uses: actions/upload-artifact@v4
        with:
          name: JlMol-linux-x64
          path: build/packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    if: inputs.target != 'macos'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
          arch: x64
      - name: Build and test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/portable -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DJLMOL_PACKAGE_DESKTOP=ON
          cmake --build build/portable --config Release --parallel 4
          ctest --test-dir build/portable -C Release --output-on-failure
          $env:JLMOL_CORE_LIBRARY = (Resolve-Path build/portable/Release/jlmol_core.dll).Path
          $env:JULIA_DEPOT_PATH = Join-Path $PWD 'build/portable/julia-depot'
          julia --startup-file=no --project=. test/runtests.jl
      - name: Prepare software OpenGL for the Windows runner
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe-x64.7z'
          $driverDir = Join-Path $env:RUNNER_TEMP 'JlMol software OpenGL'
          $url = 'https://github.com/mmozeiko/build-mesa/releases/download/26.1.6/mesa-llvmpipe-x64-26.1.6.7z'
          curl.exe --fail --location --retry 2 --output $archive $url
          $expected = '10b94b8ca45153ef76fea25af97c194ee184420cfa16917ee320d087c2c9e471'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Mesa checksum mismatch' }
          New-Item -ItemType Directory -Path $driverDir | Out-Null
          cmake -E chdir $driverDir cmake -E tar xf $archive opengl32.dll
          Rename-Item (Join-Path $driverDir 'opengl32.dll') 'opengl32sw.dll'
          $driver = Join-Path $driverDir 'opengl32sw.dll'
          "JLMOL_SOFTWARE_OPENGL_DLL=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create and verify the MSI
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cpack --config build/portable/CPackConfig.cmake -C Release -B build/packages
          $msi = @(Get-ChildItem build/packages -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { throw 'Expected one JlMol MSI' }
          function Invoke-JlMolInstaller([string]$operation, [string]$log, [string[]]$arguments) {
            $installerArguments = $arguments + @('/qn', '/norestart', '/l*v', ('"{0}"' -f $log))
            $result = Start-Process -FilePath msiexec.exe -ArgumentList $installerArguments -Wait -PassThru
            if ($result.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              throw "MSI $operation failed with exit code $($result.ExitCode)"
            }
          }
          $package = '"{0}"' -f $msi[0].FullName
          $destination = Join-Path $env:RUNNER_TEMP 'JlMol installed package'
          $installLog = Join-Path $env:RUNNER_TEMP 'JlMol MSI install.log'
          $removeLog = Join-Path $env:RUNNER_TEMP 'JlMol MSI remove.log'
          Invoke-JlMolInstaller 'install' $installLog @('/i', $package, ('INSTALL_ROOT="{0}"' -f $destination))
          try {
            python packaging/verify_portable.py $destination --software-opengl-dll $env:JLMOL_SOFTWARE_OPENGL_DLL
          } finally {
            Invoke-JlMolInstaller 'removal' $removeLog @('/x', $package)
          }
          if (Test-Path (Join-Path $destination 'bin/jlmol.exe')) { throw 'JlMol executable remains after MSI removal' }
      - uses: actions/upload-artifact@v4
        with:
          name: JlMol-windows-x64
          path: build/packages/*.msi
          if-no-files-found: error
          compression-level: 0

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          archives: qtbase qtsvg
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
          arch: aarch64
      - name: Build and test
        run: |
          cmake -S . -B build/portable -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/portable --parallel 3
          ctest --test-dir build/portable --output-on-failure
      - name: Create and verify the macOS ZIP
        run: |
          python3 packaging/package_macos.py --build-dir build/portable \
            --macdeployqt "$QT_ROOT_DIR/bin/macdeployqt" --output-dir build/packages --archive
          mv build/packages/JlMol-macOS.zip build/packages/JlMol-macOS-arm64.zip
          unpacked="$RUNNER_TEMP/Relocated JlMol package"
          mkdir -p "$unpacked"
          ditto -x -k build/packages/JlMol-macOS-arm64.zip "$unpacked"
          python3 packaging/verify_portable.py "$unpacked/JlMol.app"
          (cd build/packages && shasum -a 256 JlMol-macOS-arm64.zip > SHA256SUMS)
      - name: Collect matching Qt source and license materials
        run: python3 packaging/collect_qt_sources.py --ci-kit
      - uses: actions/upload-artifact@v4
        with:
          name: JlMol-macos-arm64
          path: |
            build/packages/JlMol-macOS-arm64.zip
            build/packages/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: JlMol-macos-qt-sources
          path: build/release-materials/Qt-6.8.3-desktop-ci-sources.zip
          if-no-files-found: error
          compression-level: 0
